<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Expense Tracker</h1>
      <p class="app__subtitle">Track your income and expenses in real time</p>
    </header>

    <section class="balance">
      <h2 class="balance__label">Current Balance</h2>
      <p class="balance__amount" id="balance">$0.00</p>
      <div class="balance__meta">
        <div class="balance__box balance__box--income">
          <span class="balance__box-label">Income</span>
          <span class="balance__box-value" id="total-income">$0.00</span>
        </div>
        <div class="balance__box balance__box--expense">
          <span class="balance__box-label">Expenses</span>
          <span class="balance__box-value" id="total-expense">$0.00</span>
        </div>
      </div>
    </section>

    <section class="form-card">
      <h2 class="form-card__title">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" placeholder="e.g. Salary, Groceries" autocomplete="off" />
          <small class="field__error" id="description-error"></small>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01" />
          <small class="field__error" id="amount-error"></small>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select a category</option>
            <option value="Salary">Salary</option>
            <option value="Business">Business</option>
            <option value="Investments">Investments</option>
            <option value="Food">Food</option>
            <option value="Rent">Rent</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <small class="field__error" id="category-error"></small>
        </div>

        <div class="field">
          <span class="field__legend">Type</span>
          <div class="type-toggle" role="radiogroup" aria-label="Transaction type">
            <label class="type-toggle__option">
              <input type="radio" name="type" value="income" checked />
              <span>Income</span>
            </label>
            <label class="type-toggle__option">
              <input type="radio" name="type" value="expense" />
              <span>Expense</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn--primary">Add Transaction</button>
      </form>
    </section>

    <section class="history">
      <div class="history__head">
        <h2 class="history__title">History</h2>
        <button type="button" class="btn btn--ghost" id="clear-all">Clear All</button>
      </div>
      <ul class="transaction-list" id="transaction-list"></ul>
      <p class="empty-state" id="empty-state">No transactions yet. Add one above to get started.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
